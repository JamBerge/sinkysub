<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinky Sub</title>
<meta name="description" content="Tap to dive, avoid obstacles. A one-tap arcade game for iPhone.">
<meta property="og:title" content="Sinky Sub">
<meta property="og:description" content="Tap to dive, avoid obstacles. A one-tap arcade game for iPhone.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sinkysub.com/">
<meta name="theme-color" content="#082F3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --deep:#082F3D; --sea:#12667E; --reef:#2E96AC;
  --sand:#F2DFA8; --shallow:#4FB6C6;
  --ink:#0A2530; --paper:#FFFFFF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); background:var(--deep);
  font-family:Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
}

/* ---------- hero: the water column ---------- */
.hero{
  position:relative; overflow:hidden; text-align:center; padding:76px 20px 0;
  background:linear-gradient(180deg,#5CC2D0 0%,var(--reef) 28%,var(--sea) 66%,var(--deep) 100%);
}
/* light shafts, the way the game draws them */
.hero::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(103deg,transparent 18%,rgba(255,255,255,.16) 20%,transparent 24%),
    linear-gradient(97deg,transparent 44%,rgba(255,255,255,.12) 46%,transparent 51%),
    linear-gradient(107deg,transparent 68%,rgba(255,255,255,.14) 70%,transparent 75%);
}
.hero-inner{position:relative; max-width:1000px; margin:0 auto}

h1{
  font-family:Silkscreen,"Courier New",monospace; font-weight:700;
  /* Silkscreen is wide and the name must not break, so the floor here keeps
     nine characters inside a 320px phone. */
  font-size:clamp(1.55rem,10.5vw,5.6rem); line-height:.98; margin:0;
  color:#EAF7FA; letter-spacing:.02em;
  text-shadow:0 5px 0 #0C4152, 0 9px 0 rgba(8,47,61,.35);
}
.tag{
  margin:22px auto 0; max-width:26ch; color:var(--paper); font-weight:800;
  font-size:clamp(1.1rem,3vw,1.45rem); line-height:1.4;
  text-shadow:0 2px 6px rgba(6,32,42,.4);
}
.sub{
  margin:10px auto 0; max-width:30ch; color:#0A3644; font-weight:700;
  font-size:clamp(.98rem,2.3vw,1.1rem);
}

.cta{margin:34px 0 0; display:flex; flex-direction:column; align-items:center; gap:11px}
.badge{
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--ink); color:var(--paper); text-decoration:none;
  padding:14px 30px; border-radius:12px; font-weight:700; font-size:1.02rem;
  box-shadow:0 4px 0 rgba(4,22,29,.45);
  transition:transform .12s ease, box-shadow .12s ease;
}
.badge:hover,.badge:focus-visible{transform:translateY(-2px); box-shadow:0 6px 0 rgba(4,22,29,.45)}
.badge:focus-visible{outline:3px solid var(--sand); outline-offset:3px}
.cta small{
  font-family:Silkscreen,monospace; font-size:11px; letter-spacing:.13em;
  text-transform:uppercase; color:#08313F;
}

/* ---------- the screens ---------- */
.shots{
  display:flex; justify-content:center; align-items:flex-end;
  gap:clamp(10px,3vw,34px); margin:54px auto 0; max-width:940px; padding:0 8px;
}
.shots img{
  width:clamp(132px,25vw,268px); height:auto; display:block;
  border-radius:16px; border:3px solid rgba(8,47,61,.55);
  box-shadow:0 18px 40px -14px rgba(3,20,27,.75);
}
.shots img:nth-child(2){margin-bottom:clamp(14px,4vw,42px)}
.floor{height:96px; background:linear-gradient(180deg,transparent,var(--deep) 62%); margin-top:-30px}

footer{
  padding:16px 24px 52px; text-align:center;
  background:var(--deep); color:#8FB3BD; font-size:.9rem;
}
footer nav{display:flex; flex-wrap:wrap; gap:8px 22px; justify-content:center; margin:0 0 20px}
footer a{color:var(--shallow); text-decoration:none; font-weight:700}
footer a:hover,footer a:focus-visible{text-decoration:underline}
footer p{margin:5px 0; font-size:.82rem; color:#5E838E}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){
  .hero{padding-top:54px}
  .shots img:nth-child(3){display:none}
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <h1>SINKY&nbsp;SUB</h1>
    <p class="tag">Tap to dive, avoid obstacles.</p>
    <p class="sub">Unlock new submarines as you go.</p>

    <div class="cta">
      <a class="badge" href="#">Coming soon to the App&nbsp;Store</a>
      <small>iPhone · iOS 16+</small>
    </div>

    <div class="shots">
      <img src="shot-2-title.png" alt="The Sinky Sub title screen, a yellow submarine bobbing beneath the logo in a coral reef." width="515" height="1120" loading="lazy">
      <img src="shot-1-gameplay.png" alt="Gameplay: the submarine diving past tall pink coral columns." width="515" height="1120">
      <img src="shot-4-medals.png" alt="The scores screen, showing a best score and tallies of copper, silver, gold and diamond medals." width="515" height="1120" loading="lazy">
    </div>
  </div>
  <div class="floor"></div>
</header>

<footer>
  <nav>
    <a href="support.html">Support</a>
    <a href="privacy-policy.html">Privacy</a>
    <a href="mailto:support@sinkysub.com">support@sinkysub.com</a>
  </nav>
  <p>Copyright &copy; 2026 James Bergeron. All rights reserved.</p>
  <p>Sinky Sub and the Sinky Sub logo are trademarks of James Bergeron.</p>
</footer>

</body>
</html>
